{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Customer Login - POS</title>

    <link
      href="{% static 'admin/vendor/fontawesome-free/css/all.min.css' %}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link href="{% static 'admin/css/sb-admin-2.min.css' %}" rel="stylesheet" />
  </head>

  <body class="bg-gradient-primary">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-7 col-md-9">
          <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-5">
              <div class="text-center">
                <h1 class="h4 text-gray-900 mb-4">Customer Portal Login</h1>
                {% if error %}
                <div class="alert alert-danger py-2" role="alert">
                  {{ error }}
                </div>
                {% endif %}
              </div>

              <form class="user" action="/checkcustomerlogin/" method="post">
                {% csrf_token %}
                <div class="form-group">
                  <input
                    type="email"
                    name="cemail"
                    class="form-control form-control-user"
                    placeholder="Enter Email Address..."
                    required
                  />
                </div>
                <div class="form-group">
                  <input
                    type="password"
                    name="cpassword"
                    class="form-control form-control-user"
                    placeholder="Password"
                    required
                  />
                </div>
                <button
                  type="submit"
                  class="btn btn-primary btn-user btn-block"
                >
                  Login
                </button>
              </form>
              <hr />
              <div class="text-center">
                <small class="text-muted"
                  >Default Test Login: customer@gmail.com / 123456</small
                >
              </div>
              <div class="text-center mt-2">
                <a class="small" href="/customerregister/"
                  >Don't have an account? Create one!</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="{% static 'admin/vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'admin/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'admin/vendor/jquery-easing/jquery.easing.min.js' %}"></script>
    <script src="{% static 'admin/js/sb-admin-2.min.js' %}"></script>
  </body>
</html>
