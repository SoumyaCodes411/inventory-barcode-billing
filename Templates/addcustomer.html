{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Add Customer</title>

    <link
      href="{% static 'admin/vendor/fontawesome-free/css/all.min.css' %}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link href="{% static 'admin/css/sb-admin-2.min.css' %}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      {% include "admin_inc/sidebar.html" %}

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          {% include "admin_inc/topbar.html" %}

          <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">Add Customer</h1>

            <div class="card shadow mb-4" style="max-width: 500px">
              <div class="card-body">
                <form action="/inscustomer/" method="post">
                  {% csrf_token %}
                  <div class="form-group">
                    <label>Customer Name</label>
                    <input
                      type="text"
                      name="cname"
                      class="form-control"
                      placeholder="Enter customer name"
                      required
                    />
                  </div>
                  <div class="form-group">
                    <label>Phone Number</label>
                    <input
                      type="text"
                      name="cphone"
                      class="form-control"
                      placeholder="Enter phone number"
                      required
                    />
                  </div>
                  <button type="submit" class="btn btn-primary">
                    Save Customer
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
        {% include "admin_inc/footer.html" %}
      </div>
    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="{% static 'admin/vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'admin/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>

    <!-- Core plugin JavaScript-->
    <script src="{% static 'admin/vendor/jquery-easing/jquery.easing.min.js' %}"></script>

    <!-- Custom scripts for all pages-->
    <script src="{% static 'admin/js/sb-admin-2.min.js' %}"></script>
  </body>
</html>
